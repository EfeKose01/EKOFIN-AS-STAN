# Temayı açıkça "light" olarak sabitliyoruz. Aksi halde Streamlit kullanıcının
# işletim sistemi koyu tema tercihini otomatik algılıyor ve st.dataframe /
# st.metric gibi bazı bileşenler (özellikle canvas tabanlı st.dataframe ızgarası)
# bizim özel "Liquid Glass" CSS temamızla çakışan koyu renkler kullanıyor.
[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans serif"

[server]
runOnSave = true
